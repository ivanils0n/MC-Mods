name: probe-golem
on:
  push:
    branches: [probe-golem]
jobs:
  probe:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - run: chmod +x ./gradlew
      - run: ./gradlew --configure-on-demand ":smartchest-1.1.0:build" "-Pminecraft_version=26.2" "-Pminecraft_dependency=~26.2"
      - name: Dump API
        run: |
          mkdir -p out
          : > out/dump.txt
          jar=""
          for j in $(find / -name '*.jar' -size +5M -not -path '*/proc/*' 2>/dev/null); do
            if unzip -l "$j" 2>/dev/null | grep -q 'CopperGolem.class'; then echo "JAR $j" >> out/dump.txt; jar=$j; break; fi
          done
          if [ -z "$jar" ]; then echo "SEM JAR" >> out/dump.txt; find / -name '*.jar' -size +5M -not -path '/proc/*' 2>/dev/null | head -40 >> out/dump.txt; fi
          if [ -n "$jar" ]; then
            unzip -l "$jar" | awk '{print $4}' | grep -iE 'copper|Weathering' > out/classes.txt
            cat out/classes.txt >> out/dump.txt
            for c in $(grep -E 'CopperGolem[A-Za-z$]*\.class$|CopperChest[A-Za-z$]*\.class$|WeatheringCopper[A-Za-z$]*\.class$' out/classes.txt | sed 's/\.class$//; s#/#.#g'); do
              echo "=== $c" >> out/dump.txt; javap -p -cp "$jar" "$c" >> out/dump.txt 2>&1
            done
            for c in net.minecraft.world.entity.ai.behavior.TransportItemsBetweenContainers net.minecraft.world.entity.ai.memory.MemoryModuleType net.minecraft.world.entity.ai.Brain net.minecraft.world.entity.ai.navigation.PathNavigation net.minecraft.world.entity.ai.memory.WalkTarget net.minecraft.world.entity.decoration.ItemFrame net.minecraft.world.entity.decoration.HangingEntity; do
              echo "=== $c" >> out/dump.txt; javap -p -cp "$jar" "$c" >> out/dump.txt 2>&1
            done
          fi
          wc -c out/dump.txt
      - name: Publicar dump
        run: |
          git config user.name ci; git config user.email ci@example.com
          git checkout -B probe-out
          git add -f out
          git commit -m "dump da API"
          git push -f origin probe-out

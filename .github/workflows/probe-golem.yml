name: probe-golem
on:
  push:
    branches: [probe-golem]
jobs:
  probe:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - run: chmod +x ./gradlew
      - run: ./gradlew --configure-on-demand ":smartchest-1.1.0:build" "-Pminecraft_version=26.2" "-Pminecraft_dependency=~26.2"
      - name: Dump API
        run: |
          mkdir -p out
          jar=""
          for j in $(find $HOME/.gradle . -name '*.jar' -size +5M 2>/dev/null); do
            if unzip -l "$j" 2>/dev/null | grep -q 'net/minecraft/world/entity/animal/coppergolem/CopperGolem.class'; then jar=$j; break; fi
          done
          echo "JAR=$jar" | tee out/dump.txt
          [ -n "$jar" ] || { unzip -l $(find $HOME/.gradle -name '*.jar' -size +5M | head -3) | grep -i copper | head -50 >> out/dump.txt; }
          if [ -n "$jar" ]; then
            unzip -l "$jar" | grep -iE 'copper|Weathering' | awk '{print $4}' >> out/classes.txt
            for c in $(grep -E 'entity/animal/coppergolem/.*\.class$' out/classes.txt | sed 's/\.class$//; s#/#.#g'); do
              echo "=== $c" >> out/dump.txt; javap -p -cp "$jar" "$c" >> out/dump.txt 2>&1
            done
            for c in net.minecraft.world.level.block.WeatheringCopper net.minecraft.world.level.block.WeatheringCopper\$WeatherState net.minecraft.world.level.block.CopperChestBlock net.minecraft.world.level.block.entity.CopperChestBlockEntity net.minecraft.world.entity.ai.behavior.TransportItemsBetweenContainers net.minecraft.world.entity.ai.memory.MemoryModuleType net.minecraft.world.entity.ai.Brain net.minecraft.world.entity.Mob net.minecraft.world.entity.EntityType net.minecraft.world.entity.ai.navigation.PathNavigation net.minecraft.world.entity.ai.memory.WalkTarget net.minecraft.world.entity.ai.behavior.BehaviorUtils; do
              echo "=== $c" >> out/dump.txt; javap -p -cp "$jar" "$c" >> out/dump.txt 2>&1
            done
          fi
          wc -c out/dump.txt
      - name: Publicar dump
        run: |
          git config user.name ci; git config user.email ci@example.com
          git checkout -B probe-out
          git add -f out
          git commit -m "dump da API"
          git push -f origin probe-out

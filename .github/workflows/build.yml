name: build
on: [push]
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - run: chmod +x ./gradlew .github/probe.sh
      - run: ./gradlew --configure-on-demand ":smartchest-1.1.0:compileJava"
      - run: .github/probe.sh

name: build
on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { mc: '26.3', dep: '>=26.3 <27' }
          - { mc: '26.2', dep: '~26.2' }
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - run: chmod +x ./gradlew
      - run: ./gradlew build "-Pminecraft_version=${{ matrix.mc }}" "-Pminecraft_dependency=${{ matrix.dep }}"
      - uses: actions/upload-artifact@v7
        with:
          name: mods-mc${{ matrix.mc }}
          path: '*/build/libs/*.jar'
      # Sobe um servidor dedicado de verdade com o Altar de Teleporte, monta/remove um altar de teste e desliga.
      - name: Teste do Altar de Teleporte num servidor real
        run: |
          mkdir -p tpaltar-1.0.0/run
          echo "eula=true" > tpaltar-1.0.0/run/eula.txt
          printf 'level-type=minecraft\\:flat\nonline-mode=false\nspawn-protection=0\n' > tpaltar-1.0.0/run/server.properties
          timeout 900 ./gradlew :tpaltar-1.0.0:runServer -Pselftest "-Pminecraft_version=${{ matrix.mc }}" "-Pminecraft_dependency=${{ matrix.dep }}" | tee server.log
          grep -q "TPALTAR SELFTEST OK" server.log
      # TEMP: assinaturas do Minecraft 26.x
      - if: always()
        run: |
          JARS=$(find ~/.gradle/caches .gradle */.gradle -name '*.jar' 2>/dev/null | grep -iE 'minecraft|fabric-api|lifecycle|events-interaction|message' | grep -v sources | tr '\n' ':')
          find ~/.gradle/caches .gradle */.gradle -name '*.jar' 2>/dev/null | grep -i minecraft | head
          for c in net.minecraft.world.inventory.AbstractContainerMenu net.minecraft.resources.ResourceKey net.minecraft.server.level.ServerPlayer net.minecraft.world.item.ItemStack net.minecraft.world.level.Level net.minecraft.world.item.crafting.RecipeManager net.minecraft.world.item.crafting.RecipeHolder net.minecraft.world.entity.player.Player net.minecraft.server.MinecraftServer net.minecraft.commands.Commands net.minecraft.commands.CommandSourceStack 'net.minecraft.world.level.block.state.BlockBehaviour$BlockStateBase' net.minecraft.world.level.CollisionGetter net.minecraft.network.chat.PlayerChatMessage net.minecraft.server.level.ServerLevel net.minecraft.world.item.component.CustomData net.minecraft.world.entity.Entity; do echo "=== $c"; javap -cp "$JARS" "$c" | grep -iE 'clicked|sendAllData|location|identifier|sendSystemMessage|teleportTo\(|hurtAndBreak|isLoaded|mayInteract|destroyBlock|getRecipes|recipeMap|id\(\)|mayUseItemAt|getTickCount|halt|createCommandSourceStack|getCommands|performPrefixedCommand|withSuppressedOutput|withLevel|withPosition|canBeReplaced|isUnobstructed|signedContent|sendParticles|copyTag|resetFallDistance|stopRiding|isRemoved|closeContainer|getWorldPath|overworld|getLevel\(|displayClientMessage|isCreative|getEntitiesOfClass'; done
          unzip -l $(find ~/.gradle/caches .gradle */.gradle -name '*.jar' 2>/dev/null | grep -i minecraft | grep -v sources | head -1) | grep -E 'world/inventory/[A-Z][A-Za-z]*(Click|Input|Action)[A-Za-z]*\.class'

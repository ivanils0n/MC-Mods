name: build
on: [push]
jobs:
  probe:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        mc: ['26.1.2', '26.2', '26.3']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - run: chmod +x ./gradlew .github/probe.sh
      - run: ./gradlew ":smartchest-1.0.0:compileJava" "-Pminecraft_version=${{ matrix.mc }}" "-Pminecraft_dependency=*"
      - run: .github/probe.sh

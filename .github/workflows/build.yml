name: build
on: [push, pull_request, workflow_dispatch]

jobs:
  # Lista as pastas de mod (as que têm build.gradle), para cada mod virar um download separado.
  mods:
    runs-on: ubuntu-24.04
    outputs:
      list: ${{ steps.find.outputs.list }}
    steps:
      - uses: actions/checkout@v6
      - id: find
        run: |
          mods=$(for d in */; do [ -f "$d/build.gradle" ] && printf '"%s",' "${d%/}"; done)
          echo "list=[${mods%,}]" >> "$GITHUB_OUTPUT"

  build:
    needs: mods
    runs-on: ubuntu-24.04
    permissions:
      contents: write # publicar o resource pack do Altar de Teleporte no release "tpaltar-pack"
    strategy:
      fail-fast: false
      matrix:
        mod: ${{ fromJSON(needs.mods.outputs.list) }}
        mc: ['26.3', '26.2']
        include:
          - { mc: '26.3', dep: '>=26.3 <27' }
          - { mc: '26.2', dep: '~26.2' }
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - run: chmod +x ./gradlew
      - run: ./gradlew ":${{ matrix.mod }}:build" "-Pminecraft_version=${{ matrix.mc }}" "-Pminecraft_dependency=${{ matrix.dep }}"
      # Um download por mod e versão do Minecraft, ex.: mc26.2-tpaltar-1.0.0
      - uses: actions/upload-artifact@v7
        with:
          name: mc${{ matrix.mc }}-${{ matrix.mod }}
          path: ${{ matrix.mod }}/build/libs/*.jar
      # Sobe um servidor dedicado de verdade com o Altar de Teleporte, monta/remove um altar de teste e desliga.
      - name: Teste do Altar de Teleporte num servidor real
        if: startsWith(matrix.mod, 'tpaltar-')
        run: |
          mkdir -p ${{ matrix.mod }}/run
          echo "eula=true" > ${{ matrix.mod }}/run/eula.txt
          printf 'level-type=minecraft\\:flat\nonline-mode=false\nspawn-protection=0\n' > ${{ matrix.mod }}/run/server.properties
          timeout 900 ./gradlew ":${{ matrix.mod }}:runServer" -Pselftest "-Pminecraft_version=${{ matrix.mc }}" "-Pminecraft_dependency=${{ matrix.dep }}" | tee server.log
          grep -q "TPALTAR SELFTEST OK" server.log
          ! grep -q "Serialization errors" server.log
      # Confere que o hash dentro do .jar é o do zip e, na main, publica o zip no release "tpaltar-pack".
      # O nome leva o hash, então cada versão do mod aponta para o seu próprio pack (o servidor envia o link sozinho).
      - name: Resource pack do Altar de Teleporte
        if: startsWith(matrix.mod, 'tpaltar-')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip=${{ matrix.mod }}/build/pack/tpaltar-pack.zip
          sha=$(sha1sum "$zip" | cut -d' ' -f1)
          jar=$(ls ${{ matrix.mod }}/build/libs/*.jar | grep -v sources | head -1)
          test "$(unzip -p "$jar" tpaltar/pack.sha1)" = "$sha"
          echo "SHA-1 do pack: $sha"
          if [ "${{ github.event_name }}" = push ] && [ "${{ github.ref }}" = refs/heads/main ]; then
            name="tpaltar-pack-$sha.zip"
            cp "$zip" "$name"
            gh release view tpaltar-pack >/dev/null 2>&1 || gh release create tpaltar-pack --title "Texturas do Altar de Teleporte" \
              --notes "Resource pack do Altar de Teleporte. O próprio mod envia o link certo aos jogadores; não é preciso configurar nada." || true
            if ! gh release view tpaltar-pack --json assets -q '.assets[].name' | grep -qx "$name"; then
              gh release upload tpaltar-pack "$name" --clobber || { sleep 10; gh release upload tpaltar-pack "$name" --clobber; }
            fi
          fi
      - name: TEMP print no jogo
        if: startsWith(matrix.mod, 'tpaltar-') && matrix.mc == '26.2'
        run: |
          set +e
          d=${{ matrix.mod }}/run
          P="-Pminecraft_version=${{ matrix.mc }} -Pminecraft_dependency=${{ matrix.dep }}"
          rm -rf $d/world
          timeout 600 ./gradlew ":${{ matrix.mod }}:runServer" -Pselftest=vitrine $P > vitrine.log 2>&1
          grep "(tpaltar)" vitrine.log
          mkdir -p $d/saves && rm -rf $d/saves/vitrine && cp -r $d/world $d/saves/vitrine
          printf 'onboardAccessibility:false\npauseOnLostFocus:false\nrenderDistance:5\nguiScale:2\nfov:0.0\n' > $d/options.txt
          sudo apt-get install -y -qq xdotool x11-utils > /dev/null
          Xvfb :99 -screen 0 1280x720x24 & sleep 3
          DISPLAY=:99 timeout 700 ./gradlew ":${{ matrix.mod }}:runClient" -Pselftest=cliente $P > client.log 2>&1 &
          for i in $(seq 1 120); do grep -q "joined the game" client.log && break; sleep 5; done
          sleep 45
          export DISPLAY=:99
          xwininfo -root -tree | grep -vE '^\s*$' | head -20
          ps aux | grep -E 'KnotClient|DISPLAY' | grep -v grep | cut -c1-200 | head -3
          for p in $(pgrep -f KnotClient); do tr '\0' '\n' < /proc/$p/environ | grep DISPLAY; done
          w=$(xdotool search --classname "." | tail -1); echo "janela: $w"; xdotool windowfocus --sync $w
          xdotool key F1; sleep 2; xdotool key F2; sleep 6; xdotool key F2; sleep 3
          ls -la $d/screenshots
          i=1; for f in $(ls $d/screenshots/*.png | sort); do cp "$f" shot$i.png; i=$((i+1)); done
          grep -E "\(tpaltar\)|joined the game|ERROR|Exception" client.log | grep -v ALSA | head -40
      - if: startsWith(matrix.mod, 'tpaltar-') && matrix.mc == '26.2'
        run: |
          git config user.name ci && git config user.email ci@users.noreply.github.com
          git checkout -q --orphan prints-tmp && git rm -rqf --cached . && git add -f shot1.png shot2.png && git commit -qm prints
          git push -qf origin HEAD:refs/heads/prints-tmp

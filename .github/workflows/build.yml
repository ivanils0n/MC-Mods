name: build
on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { mc: '26.3', dep: '>=26.3 <27' }
          - { mc: '26.2', dep: '~26.2' }
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - run: chmod +x ./gradlew
      - run: ./gradlew build "-Pminecraft_version=${{ matrix.mc }}" "-Pminecraft_dependency=${{ matrix.dep }}"
      - name: tmp-probe
        run: |
          set +e; J=~/.gradle/caches/fabric-loom/${{ matrix.mc }}/minecraft-merged.jar
          javap -p -cp $J net.minecraft.client.renderer.entity.EntityRenderer | grep extractNameTags
          mkdir x && cd x && unzip -q $J 'net/minecraft/client/renderer/*' && for f in $(grep -rl "EntityRenderState.scoreText\|state/AvatarRenderState.scoreText" . ); do echo "== $f"; javap -c -p $f | grep -B2 "putfield.*scoreText" | grep -E "putfield|^  [a-z]"; done
          javap -c -p net/minecraft/client/renderer/entity/EntityRenderer.class | awk '/void extractRenderState\(T, S, float\)/{f=1} f{print} f&&/^$/{exit}' | grep invoke
      - uses: actions/upload-artifact@v7
        with:
          name: mods-mc${{ matrix.mc }}
          path: '*/build/libs/*.jar'

name: build
on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { mc: '26.3', dep: '>=26.3 <27' }
          - { mc: '26.2', dep: '~26.2' }
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - run: chmod +x ./gradlew
      - run: ./gradlew build "-Pminecraft_version=${{ matrix.mc }}" "-Pminecraft_dependency=${{ matrix.dep }}"
      - name: tmp-probe
        run: |
          set +e; J=~/.gradle/caches/fabric-loom/${{ matrix.mc }}/minecraft-merged.jar
          unzip -l $J | grep -E "network/chat/contents/objects/|network/chat/Component.class|AtlasIds|resources/Identifier.class|resources/ResourceLocation.class" | awk '{print $4}'
          javap -cp $J net.minecraft.network.chat.Component | grep -iE "object"
          for c in $(unzip -l $J | grep -oE "net/minecraft/network/chat/contents/objects/AtlasSprite[^ ]*\.class|net/minecraft/data/AtlasIds\.class"); do javap -cp $J ${c%.class} | grep -vE "^\s*$" | head -20; done
          unzip -l $J | grep -E "textures/gui/sprites/hud/heart/(full|half|container)\.png" | awk '{print $4}'
      - uses: actions/upload-artifact@v7
        with:
          name: mods-mc${{ matrix.mc }}
          path: '*/build/libs/*.jar'

name: build
on: [push, pull_request, workflow_dispatch]

jobs:
  # Lista mod x versão do Minecraft: uma pasta com build.gradle é um mod, e cada mod diz em quais versões compila
  # (ci_minecraft_versions no gradle.properties; sem a linha: 26.3 e 26.2). Cada par vira um download separado.
  mods:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.find.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
      - id: find
        run: |
          declare -A dep=( [26.3]='>=26.3 <27' [26.2]='~26.2' [26.1.2]='>=26.1 <26.2' )
          list=""
          for d in */; do
            d=${d%/}; [ -f "$d/build.gradle" ] || continue
            v=$(sed -n 's/^ci_minecraft_versions=//p' "$d/gradle.properties"); v=${v:-26.3,26.2}
            id=$(sed -n 's/^mod_id=//p' "$d/gradle.properties")
            for mc in ${v//,/ }; do
              [ -n "${dep[$mc]}" ] || { echo "::error::$d pede o Minecraft $mc, que não está na lista do build.yml"; exit 1; }
              list="$list{\"mod\":\"$d\",\"id\":\"$id\",\"mc\":\"$mc\",\"dep\":\"${dep[$mc]}\"},"
            done
          done
          echo "matrix={\"include\":[${list%,}]}" | tee -a "$GITHUB_OUTPUT"

  build:
    needs: mods
    runs-on: ubuntu-24.04
    permissions:
      contents: write # publicar os resource packs (releases "<mod_id>-pack")
    strategy:
      fail-fast: false
      max-parallel: 4 # com mais jobs de uma vez o GitHub tem falhado ao criar os restantes ("Internal server error")
      matrix: ${{ fromJSON(needs.mods.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - run: chmod +x ./gradlew
      # --configure-on-demand: só configura o mod pedido (os outros podem não ter a versão do Minecraft da matriz).
      - run: ./gradlew --configure-on-demand ":${{ matrix.mod }}:build" "-Pminecraft_version=${{ matrix.mc }}" "-Pminecraft_dependency=${{ matrix.dep }}"
      # Um download por mod e versão do Minecraft, ex.: mc26.2-tpaltar-1.0.0
      - uses: actions/upload-artifact@v7
        with:
          name: mc${{ matrix.mc }}-${{ matrix.mod }}
          path: ${{ matrix.mod }}/build/libs/*.jar
      # Mods com autoteste (-Pselftest no build.gradle): sobe um servidor dedicado de verdade, o mod testa a si mesmo
      # e desliga. O log precisa ter "<MOD_ID> SELFTEST OK".
      - name: Autoteste num servidor real
        run: |
          find ${{ matrix.mod }}/src/main/java -name SelfTest.java | grep -q . || { echo "Mod sem autoteste."; exit 0; }
          id=${{ matrix.id }}
          mkdir -p ${{ matrix.mod }}/run
          echo "eula=true" > ${{ matrix.mod }}/run/eula.txt
          printf 'level-type=minecraft\\:flat\nonline-mode=false\nspawn-protection=0\n' > ${{ matrix.mod }}/run/server.properties
          timeout 900 ./gradlew --configure-on-demand ":${{ matrix.mod }}:runServer" -Pselftest "-Pminecraft_version=${{ matrix.mc }}" "-Pminecraft_dependency=${{ matrix.dep }}" | tee server.log
          grep -q "${id^^} SELFTEST OK" server.log
          ! grep -q "Serialization errors" server.log
      # Mods com resource pack (src/pack): confere que o hash dentro do .jar é o do zip e, na main, publica o zip no
      # release "<mod_id>-pack". O nome leva o hash, então cada versão do mod aponta para o seu próprio pack.
      - name: Resource pack
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f ${{ matrix.mod }}/src/pack/pack.mcmeta ] || { echo "Mod sem resource pack."; exit 0; }
          id=${{ matrix.id }}
          zip=${{ matrix.mod }}/build/pack/$id-pack.zip
          sha=$(sha1sum "$zip" | cut -d' ' -f1)
          jar=$(ls ${{ matrix.mod }}/build/libs/*.jar | grep -v sources | head -1)
          test "$(unzip -p "$jar" $id/pack.sha1)" = "$sha"
          echo "SHA-1 do pack: $sha"
          if [ "${{ github.event_name }}" = push ] && [ "${{ github.ref }}" = refs/heads/main ]; then
            name="$id-pack-$sha.zip"
            cp "$zip" "$name"
            gh release view $id-pack >/dev/null 2>&1 || gh release create $id-pack --title "Texturas: $id" \
              --notes "Resource pack do mod $id. O próprio mod envia o link certo aos jogadores; não é preciso configurar nada." || true
            if ! gh release view $id-pack --json assets -q '.assets[].name' | grep -qx "$name"; then
              gh release upload $id-pack "$name" --clobber || { sleep 10; gh release upload $id-pack "$name" --clobber; }
            fi
          fi
      - name: TEMP print com pack rival
        if: matrix.mod == 'tpaltar-1.0.0' && matrix.mc == '26.2'
        run: |
          set +e
          d=${{ matrix.mod }}/run
          P="--configure-on-demand -Pminecraft_version=${{ matrix.mc }} -Pminecraft_dependency=${{ matrix.dep }}"
          rm -rf $d/world
          timeout 600 ./gradlew ":${{ matrix.mod }}:runServer" -Pselftest=vitrine $P > vitrine.log 2>&1
          mkdir -p $d/saves && rm -rf $d/saves/vitrine && cp -r $d/world $d/saves/vitrine
          r=$d/resourcepacks/rival/assets/minecraft/items; mkdir -p $r
          echo '{"pack":{"description":"rival","min_format":1,"max_format":999}}' > $d/resourcepacks/rival/pack.mcmeta
          for i in ender_eye ender_pearl smooth_stone; do echo '{"model":{"type":"minecraft:model","model":"minecraft:block/diamond_block"}}' > $r/$i.json; done
          printf 'tutorialStep:none\nonboardAccessibility:false\npauseOnLostFocus:false\nrenderDistance:4\nguiScale:3\nresourcePacks:["vanilla","fabric","file/rival"]\n' > $d/options.txt
          sudo apt-get install -y -qq xdotool > /dev/null
          timeout 600 ./gradlew ":${{ matrix.mod }}:runClient" -Pselftest=cliente $P > client.log 2>&1 &
          for i in $(seq 1 120); do grep -q "joined the game" client.log && break; sleep 5; done
          sleep 3
          p=$(pgrep -f 'java.*KnotClient' | tail -1)
          export $(tr '\0' '\n' < /proc/$p/environ | grep -E '^(DISPLAY|XAUTHORITY)=' | xargs)
          w=$(xdotool search --classname "." | tail -1); xdotool windowfocus --sync $w
          sleep 35; xdotool key F2; sleep 4
          f=$(ls $d/screenshots/*.png | head -1); cp "$f" shot1.png
          grep -E "Reloading ResourceManager|resource pack" client.log | head -5
          git config user.name ci && git config user.email ci@users.noreply.github.com
          git checkout -q --orphan prints-tmp && git rm -rqf --cached . && git add -f shot1.png && git commit -qm prints
          git push -qf origin HEAD:refs/heads/prints-tmp

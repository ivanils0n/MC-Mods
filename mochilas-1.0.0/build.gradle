plugins {
	id 'net.fabricmc.fabric-loom'
}

version = "${mod_version}+mc${minecraft_version}"
group = 'io.github.ivanils0n'
base.archivesName = mod_id

repositories {
	maven { url = 'https://maven.nucleoid.xyz' }
}

// Versão do Fabric API escolhida pela versão do Minecraft (ex.: fabric_api_26_2 no gradle.properties).
def fabricApiVersion = project.property("fabric_api_" + minecraft_version.replace('.', '_'))

dependencies {
	minecraft "com.mojang:minecraft:${minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${fabricApiVersion}"
	// Polymer (itens, resource pack, autohost e entidades virtuais) e SGUI (telas) vão dentro do .jar:
	// no servidor e no singleplayer basta este .jar + Fabric API.
	implementation "eu.pb4:polymer-bundled:${polymer_version}"
	include "eu.pb4:polymer-bundled:${polymer_version}"
	implementation "eu.pb4:sgui:${sgui_version}"
	include "eu.pb4:sgui:${sgui_version}"
}

// -Pselftest: o runServer sobe um servidor real, testa itens, receitas, inventários e equipamento e desliga (usado no CI).
if (project.hasProperty('selftest')) {
	loom.runs.server.vmArg('-Dmochilas.selftest=true')
}

processResources {
	def props = [version: project.version, minecraft_dependency: minecraft_dependency]
	inputs.properties props
	filesMatching("fabric.mod.json") {
		expand props
	}
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = 'UTF-8'
}

// Prints do cliente (só CI): ./gradlew runClientGameTest com xvfb; ver src/gametest.
fabricApi {
	configureTests {
		createSourceSet = true
		modId = 'mochilas-gametest'
		enableGameTests = false
		enableClientGameTests = true
		eula = true
	}
}

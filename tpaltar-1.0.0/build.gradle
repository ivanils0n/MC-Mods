plugins {
	id 'net.fabricmc.fabric-loom'
}

version = "${mod_version}+mc${minecraft_version}"
group = 'io.github.ivanils0n'
base.archivesName = mod_id

// Versão do Fabric API escolhida pela versão do Minecraft (ex.: fabric_api_26_2 no gradle.properties).
def fabricApi = project.property("fabric_api_" + minecraft_version.replace('.', '_'))

dependencies {
	minecraft "com.mojang:minecraft:${minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${fabricApi}"
}

// -Pselftest: o runServer sobe um servidor real, monta e remove um altar de teste e desliga (usado no CI).
if (project.hasProperty('selftest')) {
	loom.runs.server.vmArg('-Dtpaltar.selftest=true')
}

processResources {
	def props = [version: project.version, minecraft_dependency: minecraft_dependency]
	inputs.properties props
	filesMatching("fabric.mod.json") {
		expand props
	}
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}
